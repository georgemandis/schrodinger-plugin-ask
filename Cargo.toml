[package]
name = "schrodinger-plugin-ask"
version = "0.1.0"
edition = "2021"
description = "Ask a local model about a clip, through Ollama"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
schrodinger-plugin-sdk = { git = "https://github.com/georgemandis/schrodinger-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
